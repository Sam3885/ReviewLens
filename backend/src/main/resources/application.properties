# Application
spring.application.name=reviewlens
server.port=${PORT:8080}
frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Load an optional local .env from either the repository root or backend/.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reviewlens_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Server Configuration
server.error.include-message=always

# Gemini API Configuration
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
